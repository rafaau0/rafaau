name: Quality

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify build channel
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or -not $env:GITHUB_REF_NAME.StartsWith('v')) {
            "is_release=false" >> $env:GITHUB_OUTPUT
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
            "requires_signing=false" >> $env:GITHUB_OUTPUT
            "artifact_name=NeivaPlanner-Windows-CI" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+$') {
            "is_release=true" >> $env:GITHUB_OUTPUT
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
            "requires_signing=true" >> $env:GITHUB_OUTPUT
            "artifact_name=NeivaPlanner-Windows-STABLE-SIGNED" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$') {
            "is_release=true" >> $env:GITHUB_OUTPUT
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
            "requires_signing=false" >> $env:GITHUB_OUTPUT
            "artifact_name=NeivaPlanner-Windows-PRERELEASE-UNSIGNED" >> $env:GITHUB_OUTPUT
            exit 0
          }

          throw "Tag de release inválida: $env:GITHUB_REF_NAME. Use vX.Y.Z para produção ou vX.Y.Z-sufixo para prerelease."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt -r ai_service/requirements.txt pip-audit
      - name: Dependency integrity
        run: python -m pip check
      - name: Security audit
        run: python -m pip_audit -r requirements.txt; python -m pip_audit -r ai_service/requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: neiva-site/package-lock.json
      - name: Install website dependencies
        working-directory: neiva-site
        run: npm ci
      - name: Website lint
        working-directory: neiva-site
        run: npm run lint
      - name: Website build
        working-directory: neiva-site
        run: npm run build
      - name: Prepare bundled FFmpeg
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare_ffmpeg.ps1
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean NeivaPlanner.spec
      - name: Verify bundled FFmpeg
        run: |
          $contents = python -m PyInstaller.utils.cliutils.archive_viewer -l dist/NeivaPlanner_v1.exe
          $hasFfmpeg = $contents | Select-String -SimpleMatch 'assets\\ffmpeg\\ffmpeg.exe'
          $hasFfprobe = $contents | Select-String -SimpleMatch 'assets\\ffmpeg\\ffprobe.exe'
          if (-not $hasFfmpeg -or -not $hasFfprobe) {
            throw 'FFmpeg ou FFprobe não foi incorporado ao executável.'
          }
      - name: Sign release executable
        if: steps.release.outputs.requires_signing == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:SIGNING_CERTIFICATE_PASSWORD) {
            throw 'Configure SIGNING_CERTIFICATE_BASE64 e SIGNING_CERTIFICATE_PASSWORD antes de publicar uma release.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'rafaau-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          & signtool sign /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/NeivaPlanner_v1.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar o executável.' }
          $signature = Get-AuthenticodeSignature -LiteralPath dist/NeivaPlanner_v1.exe
          if ($signature.Status -ne 'Valid') { throw "Assinatura inválida: $($signature.Status)" }
          Remove-Item -LiteralPath $certificatePath -Force
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}-${{ github.sha }}
          path: dist/NeivaPlanner_v1.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        run: |
          Copy-Item -LiteralPath dist/NeivaPlanner_v1.exe -Destination dist/rafaau_v1.exe
          $title = "rafaau $env:GITHUB_REF_NAME"
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME, 'dist/rafaau_v1.exe',
            '--title', $title, '--generate-notes', '--verify-tag'
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release no GitHub.' }
