name: Quality

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt -r ai_service/requirements.txt pip-audit
      - name: Dependency integrity
        run: python -m pip check
      - name: Security audit
        run: python -m pip_audit -r requirements.txt; python -m pip_audit -r ai_service/requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Prepare bundled FFmpeg
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare_ffmpeg.ps1
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean NeivaPlanner.spec
      - name: Verify bundled FFmpeg
        run: |
          $contents = python -m PyInstaller.utils.cliutils.archive_viewer -l dist/NeivaPlanner_v1.exe
          $hasFfmpeg = $contents | Select-String -SimpleMatch 'assets\\ffmpeg\\ffmpeg.exe'
          $hasFfprobe = $contents | Select-String -SimpleMatch 'assets\\ffmpeg\\ffprobe.exe'
          if (-not $hasFfmpeg -or -not $hasFfprobe) {
            throw 'FFmpeg ou FFprobe não foi incorporado ao executável.'
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NeivaPlanner-Windows-${{ github.sha }}
          path: dist/NeivaPlanner_v1.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath dist/NeivaPlanner_v1.exe -Destination dist/rafaau_v1.exe
          gh release create $env:GITHUB_REF_NAME dist/rafaau_v1.exe --title "rafaau $env:GITHUB_REF_NAME" --generate-notes --verify-tag
